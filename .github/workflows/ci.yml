name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  frontend:
    name: Frontend・E2E ヘルパー
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix e2e ci
      - name: Lint（自動修正なし）
        run: |
          npm --prefix frontend run lint -- --deny-warnings
          frontend/node_modules/.bin/oxlint --deny-warnings e2e terraform/tests scripts
      - name: JavaScript・TypeScript 整形チェック（自動修正なし）
        run: npm --prefix frontend run format:check
      - name: 単体テスト
        run: |
          npm --prefix frontend run test:unit
          npm --prefix e2e run test:unit
      - name: 型チェック・ビルド
        run: npm --prefix frontend run build
        env:
          VITE_USE_MOCK_COGNITO: 'true'

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.12'
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Lint・整形チェック（自動修正なし）
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - run: uv run --frozen python -m pytest
        env:
          USE_MOCK_COGNITO: '1'
          AWS_EC2_METADATA_DISABLED: 'true'

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false
      - name: 整形チェック（自動修正なし）
        run: terraform fmt -check -recursive terraform
      - name: Provider 初期化・構文検証
        run: |
          terraform -chdir=terraform/app init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/app validate
          terraform -chdir=terraform/ecr init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/ecr validate
      - name: AWS 非接続の MFA 設定テスト
        run: node --test terraform/tests/*.test.mjs

  mock-e2e:
    name: モック E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.12'
          python-version: '3.13'
      - run: npm --prefix frontend ci
      - run: npm --prefix e2e ci
      - run: uv sync --project backend --frozen
      - name: Chromium と実行依存のインストール
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: モック E2E 実行
        id: e2e
        run: npm --prefix e2e run test:e2e
      - name: 画面キャプチャ・レポートの保存
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: warn
