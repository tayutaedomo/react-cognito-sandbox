[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for react-cognito-sandbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "boto3==1.43.89",
    "aws-lambda-powertools>=3.35.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.12.0",
    "ruff>=0.16.6",
    "moto[all]>=5.2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette.*",
]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
